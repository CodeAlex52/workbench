<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <span class="dot"></span>工作台
      <span class="ver">v0.1</span>
    </div>
    <div class="rail-label">内容 <span id="source" class="source"></span></div>
    <nav id="list" class="list"></nav>
    <div class="rail-foot">
      <button id="btn-health" class="ghost">检查连通</button>
      <div id="health" class="health"></div>
    </div>
  </aside>

  <main class="stage">
    <header class="head">
      <div class="head-main">
        <h1 id="title">选一篇内容</h1>
        <p id="desc">左边挑一篇，右边看三端状态。</p>
      </div>
      <div id="tags" class="tags"></div>
    </header>

    <section id="cards" class="cards"></section>

    <section class="log">
      <div class="log-head">
        <span>运行日志</span>
        <span id="jobstate" class="jobstate">空闲</span>
      </div>
      <pre id="logbody">等待操作…</pre>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
